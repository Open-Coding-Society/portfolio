<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>{{ page.title | escape }}</title>
  <link rel="canonical" href="{{ page.reader_redirect_url | absolute_url }}">
</head>
<body>
  <p><a id="reader-destination" href="{{ page.reader_redirect_url | relative_url }}?context=topics">Continue to {{ page.title | escape }}</a>.</p>
  <script>
    const link = document.getElementById('reader-destination');
    const target = new URL(link.href);
    const incoming = new URLSearchParams(location.search);
    incoming.delete('context');
    incoming.delete('course');
    incoming.forEach((value, key) => target.searchParams.append(key, value));
    target.hash = location.hash;
    location.replace(target.href);
  </script>
</body>
</html>
